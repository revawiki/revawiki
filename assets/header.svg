  <style>
    .sq { fill: #ffffff; opacity: 0.16; animation: drift 9s linear infinite; }
    .sq2 { animation-duration: 12s; opacity: 0.12; }
    .sq3 { animation-duration: 7s; opacity: 0.2; }
    @keyframes drift {
      from { transform: translateX(-60px) rotate(0deg); }
      to   { transform: translateX(1660px) rotate(90deg); }
    }
    .title, .subtitle { fill: #ffffff; font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif; animation: fadeIn 1.2s ease-in-out forwards; }
    .title { font-size: 60px; font-weight: 700; }
    .subtitle { font-size: 24px; font-weight: 500; }
    .mark { fill: #ffffff; animation: fadeIn 1.2s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
  <rect width="1600" height="200" fill="url(#headerGrad)"/>
  <rect class="sq" x="120" y="40" width="18" height="18" style="animation-delay:0s"/>
