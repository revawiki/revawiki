<svg width="1600" height="100" viewBox="0 0 1600 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#250740"/>
      <stop offset="20%" stop-color="#3B005C"/>
      <stop offset="40%" stop-color="#570044"/>
      <stop offset="60%" stop-color="#750227"/>
      <stop offset="80%" stop-color="#950706"/>
      <stop offset="100%" stop-color="#AC131C"/>
    </linearGradient>
  </defs>
  <style>
    .sq { fill: #ffffff; opacity: 0.16; animation: drift 9s linear infinite; }
    .sq2 { animation-duration: 12s; opacity: 0.12; }
    .sq3 { animation-duration: 7s; opacity: 0.2; }
    @keyframes drift {
      from { transform: translateX(-60px) rotate(0deg); }
      to   { transform: translateX(1660px) rotate(90deg); }
    }
  </style>
  <rect width="1600" height="100" fill="url(#footerGrad)"/>
  <rect class="sq" x="200" y="20" width="14" height="14" style="animation-delay:0.5s"/>
  <rect class="sq sq2" x="560" y="60" width="12" height="12" style="animation-delay:2s"/>
  <rect class="sq sq3" x="920" y="30" width="16" height="16" style="animation-delay:4s"/>
  <rect class="sq" x="1300" y="55" width="12" height="12" style="animation-delay:5.5s"/>
</svg>
